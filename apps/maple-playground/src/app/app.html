<header
  class="flex h-12 shrink-0 items-center justify-between border-b border-neutral-200 bg-white px-4 dark:border-neutral-800 dark:bg-neutral-900">
  <div class="flex items-center gap-3">
    <div class="flex items-baseline gap-2">
      <span class="text-lg leading-none">🍁</span>
      <h1 class="text-sm font-semibold tracking-tight">Maple</h1>
      <span class="hidden text-sm text-neutral-400 lg:inline dark:text-neutral-500"
        >Playground</span
      >
      <span class="hidden font-mono text-xs text-neutral-400 sm:inline dark:text-neutral-500">
        v{{ VERSION }}
      </span>
    </div>
    <button
      type="button"
      class="flex h-7 items-center gap-1 rounded-full bg-amber-100 px-2.5 text-xs font-medium whitespace-nowrap text-amber-800 transition-colors hover:bg-amber-200 dark:bg-amber-900/40 dark:text-amber-300 dark:hover:bg-amber-900/70"
      (click)="welcome().open()">
      What is Maple?
    </button>
  </div>
  <div class="flex items-center gap-2">
    <maple-examples-menu (pick)="load($event)" />
    <maple-settings-menu
      [(maxOps)]="maxOps"
      [(maxDepth)]="maxDepth">
    </maple-settings-menu>
    <button
      type="button"
      title="Reset playground"
      class="flex h-7 items-center gap-1 rounded-full border border-neutral-200 px-2.5 text-xs font-medium text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-neutral-800 dark:border-neutral-700 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100"
      (click)="reset()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="size-3.5">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span class="hidden md:inline">Reset</span>
    </button>
    <a
      [href]="LINKS.github"
      target="_blank"
      rel="noopener"
      title="Maple on GitHub"
      class="hidden size-7 items-center justify-center rounded-full text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-neutral-800 sm:flex dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100">
      <svg
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
        class="size-4">
        <path
          d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z" />
      </svg>
    </a>
    <a
      [href]="LINKS.npm"
      target="_blank"
      rel="noopener"
      title="@netwin/maple on npm"
      class="hidden size-7 items-center justify-center rounded-full text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-neutral-800 sm:flex dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100">
      <span class="font-mono text-[11px] font-bold tracking-tight">npm</span>
    </a>
    <maple-theme-picker />
  </div>
</header>

<main class="min-h-0 flex-1 p-3">
  <maple-split
    class="h-full"
    storageKey="maple-playground-panes">
    <maple-pane
      slot="pane"
      title="Host context">
      <maple-badge slot="badge">JS</maple-badge>
      <maple-code-editor
        language="javascript"
        [(value)]="hostContext">
      </maple-code-editor>
    </maple-pane>

    <maple-pane
      slot="pane"
      title="Script">
      <div
        slot="badge"
        class="flex items-center gap-1.5">
        <maple-badge>Sandboxed</maple-badge>
        <maple-badge>JS</maple-badge>
      </div>
      <maple-code-editor
        language="javascript"
        [(value)]="codeString">
      </maple-code-editor>
    </maple-pane>

    <maple-pane
      slot="pane"
      title="Output">
      <maple-tabs
        slot="tabs"
        label="Output view"
        [options]="outputTabs"
        [(value)]="outputTab">
      </maple-tabs>
      <maple-status-chip
        slot="badge"
        [status]="status()"
        [detail]="statusDetail()">
      </maple-status-chip>
      <!-- Both viewers stay alive, so each tab keeps its own folds and scroll position. -->
      <div
        class="h-full"
        [class.hidden]="outputTab() !== 'result' || outputMissing()">
        <maple-code-editor
          language="json"
          readOnly
          [value]="resultDocument()">
        </maple-code-editor>
      </div>
      <div
        class="h-full"
        [class.hidden]="outputTab() !== 'ast' || outputMissing()">
        <maple-code-editor
          language="json"
          readOnly
          [value]="astDocument()">
        </maple-code-editor>
      </div>
      @if (outputTab() === 'benchmark') {
        <maple-benchmark-panel
          [status]="benchmarkStatus()"
          [response]="benchmarkResponse()"
          (start)="runBenchmark()">
        </maple-benchmark-panel>
      }
      @if (outputMissing()) {
        @if (outputError(); as error) {
          <p
            class="p-4 font-mono text-sm wrap-break-word whitespace-pre-wrap text-rose-600 dark:text-rose-400">
            {{ error }}
          </p>
        } @else {
          <p class="p-4 text-sm text-neutral-400 dark:text-neutral-600">
            {{ outputPlaceholder() }}
          </p>
        }
      }
    </maple-pane>
  </maple-split>
</main>

<maple-welcome-dialog (closed)="welcomeSeen.set(true)" />
