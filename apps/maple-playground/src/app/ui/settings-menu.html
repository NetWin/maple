<button
  type="button"
  title="Run settings"
  popovertarget="maple-settings"
  class="flex h-7 items-center gap-1 rounded-full border border-neutral-200 px-2.5 text-xs font-medium text-neutral-500 transition-colors [anchor-name:--maple-settings] hover:bg-neutral-100 hover:text-neutral-800 dark:border-neutral-700 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100">
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    class="size-3.5">
    <path
      d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
    <circle
      cx="12"
      cy="12"
      r="3" />
  </svg>
  <span class="hidden md:inline">Settings</span>
</button>

<div
  id="maple-settings"
  popover="auto"
  class="inset-auto top-[anchor(bottom)] right-[anchor(right)] m-0 mt-2 w-64 rounded-xl border border-neutral-200 bg-white p-3 text-neutral-700 shadow-lg [position-anchor:--maple-settings] dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-200">
  <h2
    class="mb-2 text-xs font-semibold tracking-wide text-neutral-400 uppercase dark:text-neutral-500">
    Run limits
  </h2>
  <label class="flex items-center justify-between gap-3 py-1 text-xs">
    <span>Max operations</span>
    <input
      type="number"
      min="1"
      step="1"
      inputmode="numeric"
      [value]="maxOps()"
      [placeholder]="DEFAULTS.MAX_OPS"
      (input)="update(maxOps, $event)"
      (blur)="restore(maxOps, $event)"
      class="w-28 rounded-md border border-neutral-200 bg-transparent px-2 py-1 text-right font-mono text-xs tabular-nums outline-none focus:border-neutral-400 dark:border-neutral-700 dark:focus:border-neutral-500" />
  </label>
  <label class="flex items-center justify-between gap-3 py-1 text-xs">
    <span>Max depth</span>
    <input
      type="number"
      min="1"
      step="1"
      inputmode="numeric"
      [value]="maxDepth()"
      [placeholder]="DEFAULTS.MAX_DEPTH"
      (input)="update(maxDepth, $event)"
      (blur)="restore(maxDepth, $event)"
      class="w-28 rounded-md border border-neutral-200 bg-transparent px-2 py-1 text-right font-mono text-xs tabular-nums outline-none focus:border-neutral-400 dark:border-neutral-700 dark:focus:border-neutral-500" />
  </label>
</div>
